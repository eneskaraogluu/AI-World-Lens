name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: "1"
      DATABASE_URL: sqlite://
      OPENAI_API_KEY: offline-test-placeholder
      GEMINI_API_KEY: offline-test-placeholder
      RUN_LIVE_API_TESTS: "0"
      RUN_REAL_DATABASE_TESTS: "0"
      ALLOW_DESTRUCTIVE_DATABASE_TESTS: "0"
      RUN_LOCAL_SERVER_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run backend offline tests
        run: |
          python test_data_integrity.py
          python test_openai_generator.py
          python test_mock.py
          python test_mock_api.py
          python test_queue_worker_session_lifecycle.py
          python test_quality_gate.py
          python test_presentation_backup.py
          python test_presentation_backup_api.py
          python test_presentation_migration.py
          python test_research_api.py
          python test_research_campaign_lifecycle.py
          python test_research_core.py
          python test_research_migration.py
          python test_vision_failover.py
      - name: Run frontend offline tests
        run: |
          node --check frontend/js/app_v3.js
          node test_cinema_real_dom.js
          node test_cinema_image_state.js
          node test_cinema_presentation.js
          node test_frontend_integrity.js
          node test_failover_frontend.js
          node test_presentation_backup_frontend.js
          node test_image_fit_frontend.js
          node test_view_full_comparison_frontend.js

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-world-lens:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
